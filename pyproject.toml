[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-review-board"
version = "2.4.0"
description = "MCP review board that lets different coding agents review each other"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ly8427" }]
keywords = ["mcp", "mcp-server", "code-review", "ai-agents", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["fastmcp>=3.4"]

[project.urls]
Homepage = "https://github.com/ly8427/mcp-review-board"

[project.scripts]
review-board = "server:main"

[tool.setuptools]
py-modules = ["server"]
